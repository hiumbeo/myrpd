name: RDP-Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Setup ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .
          .\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "Axiom@2024!" -AsPlainText -Force)

      - name: Start ngrok TCP tunnel
        run: |
          Start-Process -NoNewWindow .\ngrok.exe -ArgumentList "tcp 3389"
          Start-Sleep -Seconds 10
          Invoke-RestMethod http://localhost:4040/api/tunnels | ConvertTo-Json

      - name: Keep alive
        run: |
          Write-Host "=========================================="
          Write-Host "RDP INFO:"
          Write-Host "User: runneradmin"
          Write-Host "Pass: Axiom@2024!"
          Write-Host "Server: chạy lệnh bên dưới để lấy link"
          Write-Host "  curl http://localhost:4040/api/tunnels"
          Write-Host "=========================================="
          $env:NGROK_URL = (Invoke-RestMethod http://localhost:4040/api/tunnels).tunnels[0].public_url
          Write-Host "Ngrok URL: $env:NGROK_URL"
          Write-Host "Address: $($env:NGROK_URL -replace 'tcp://','')"
          Write-Host "=========================================="
          Start-Sleep -Seconds 21600
