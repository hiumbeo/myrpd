name: RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "Axiom@2024!" -AsPlainText -Force)

      - name: Download bore
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath . -Force

      - name: Start tunnel
        shell: pwsh
        run: |
          $log = "$PWD\bore_out.log"
          $err = "$PWD\bore_err.log"
          $proc = Start-Process -FilePath "$PWD\bore.exe" `
            -ArgumentList "local","3389","--to","bore.pub" `
            -RedirectStandardOutput $log `
            -RedirectStandardError $err `
            -NoNewWindow -PassThru
          Write-Host "bore PID: $($proc.Id)"
          Start-Sleep -Seconds 12
          Write-Host "===== STDOUT ====="
          if (Test-Path $log) { Get-Content $log }
          Write-Host "===== STDERR ====="
          if (Test-Path $err) { Get-Content $err }
          Write-Host "=================="
          Write-Host "User: runneradmin"
          Write-Host "Pass: Axiom@2024!"
          Write-Host "Tìm dòng 'listening at bore.pub:XXXXX' ở trên"
          Write-Host "=================="
          Start-Sleep -Seconds 21600
